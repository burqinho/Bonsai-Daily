<title>Bonsai Daily</title>
<style>
  :root{
    --bg:#e9ebe3; --bg-deep:#1f3a2e; --bg-deep-2:#16271f;
    --card:#f7f6f0; --card-2:#fbfaf5;
    --ink:#24302a; --muted:#6b756d; --line:#d8d9cd;
    --copper:#a6703f; --moss:#5e7c58;
    --shadow:0 1px 2px rgba(31,58,46,.06), 0 6px 22px rgba(31,58,46,.08);
    --radius:14px;
    --c-repot:#b5683c; --c-fertilize:#6e8a4e; --c-defoliate:#c99a3a;
    --c-wire:#a6703f; --c-prune:#3e6b5a; --c-observe:#5b6e80;
    --c-treatment:#8a6e9e; --c-other:#8a8a80;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom);}
  .serif{font-family:"Fraunces","Iowan Old Style",Georgia,"Times New Roman",serif;}
  button{font-family:inherit;cursor:pointer}
  img{display:block}
  :focus-visible{outline:2px solid var(--copper);outline-offset:2px;border-radius:6px}

  header.top{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--bg-deep),var(--bg-deep-2));
    color:#eef1e8;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));
    display:flex;align-items:center;gap:10px;box-shadow:0 2px 14px rgba(0,0,0,.18);}
  .brand{display:flex;align-items:center;gap:10px;background:none;border:none;color:inherit;padding:0;text-align:left}
  .brand .kanji{font-size:15px;line-height:1.15;opacity:.85;font-weight:600;writing-mode:horizontal-tb;max-width:34px;text-align:center}
  .brand .titles{display:flex;flex-direction:column;line-height:1.1}
  .brand .sub{font-size:11px;opacity:.7;letter-spacing:.3px}
  .spacer{flex:1}
  .icon-btn{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);color:#eef1e8;
    border-radius:10px;padding:8px 11px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
  .icon-btn:hover{background:rgba(255,255,255,.18)}

  main{max-width:1040px;margin:0 auto;padding:18px 16px 90px}

<script>
/* ============================================================
   Bonsai Defteri — çevrimdışı, localStorage, TR/EN
   ============================================================ */
const STORE_KEY = 'bonsai_data_v1';

/* dil yardımcısı: L('türkçe','english') */
function L(tr,en){ return (data && data.lang==='en') ? en : tr; }

const CATS = {
  repot:    {tr:'Saksı değişimi',    en:'Repotting',     hex:'#b5683c', icon:'🪴'},
  fertilize:{tr:'Gübreleme',         en:'Fertilizing',   hex:'#6e8a4e', icon:'🌿'},
  defoliate:{tr:'Yapraksızlaştırma', en:'Defoliation',   hex:'#c99a3a', icon:'🍂'},
  wire:     {tr:'Telleme',           en:'Wiring',        hex:'#a6703f', icon:'🧵'},
  prune:    {tr:'Budama',            en:'Pruning',       hex:'#3e6b5a', icon:'✂️'},
  observe:  {tr:'Gözlem / Durum',    en:'Observation',   hex:'#5b6e80', icon:'🔍'},
  treatment:{tr:'Takviye / Mantar',  en:'Treatment',     hex:'#8a6e9e', icon:'🍄'},
  other:    {tr:'Diğer',             en:'Other',         hex:'#8a8a80', icon:'•'},
};
const CAT_KEYS = Object.keys(CATS);
function catLabel(k){ const c=CATS[k]||CATS.other; return L(c.tr,c.en); }
function methodLabel(m){ return m==='shin'?L('Shin temizliği','Shin cleaning'):L('Genel kök temizliği','General root cleaning'); }

/* ---------- yardımcılar ---------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO = () => new Date().toISOString().slice(0,10);
const MONTHS_TR=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const MONTHS_EN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function months(){ return (data&&data.lang==='en')?MONTHS_EN:MONTHS_TR; }
function fmtDate(iso,dateText){ if(dateText) return dateText; if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${parseInt(d)} ${months()[parseInt(m)-1]} ${y}`; }
function yearOf(e){ return e.dateText && /^\d{4}$/.test(e.dateText) ? e.dateText : (e.date? e.date.slice(0,4):'—'); }
const SEASONS=[{k:'spring',tr:'İlkbahar',en:'Spring'},{k:'summer',tr:'Yaz',en:'Summer'},{k:'autumn',tr:'Sonbahar',en:'Autumn'},{k:'winter',tr:'Kış',en:'Winter'}];
const ANGLES=[{k:'front',tr:'Ön',en:'Front'},{k:'back',tr:'Arka',en:'Back'},{k:'side1',tr:'Sağ',en:'Right'},{k:'side2',tr:'Sol',en:'Left'}];
function seasonLabel(k){ const s=SEASONS.find(x=>x.k===k)||SEASONS[0]; return L(s.tr,s.en); }
function seasonIndex(k){ return Math.max(0,SEASONS.findIndex(x=>x.k===k)); }
function addDays(iso,n){ const x=new Date(iso+'T00:00:00'); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); }
function diffDays(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function addYears(iso,n){ const x=new Date(iso+'T00:00:00'); x.setFullYear(x.getFullYear()+n); return x.toISOString().slice(0,10); }

let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2300); }

/* ---------- durum ---------- */
let data = migrate(load());
let view = {name:'home'};
const state = {cat:'repot', method:'roots', treeCtx:null};

function load(){ try{ const r=localStorage.getItem(STORE_KEY); if(r) return JSON.parse(r);}catch(e){} return seed(); }
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }catch(e){ /* IndexedDB asıl depo; sessiz geç */ }
  if(window.__afterSave) window.__afterSave();
}

/* ---------- başlangıç verisi (kullanıcı notlarından) ---------- */
function entry(date,dateText,cat,title,notes,method){ return {id:uid(),date,dateText,category:cat,title,notes:notes||'',method:method||null,image:null}; }
function defaultFertilizers(){
  return [
    {id:uid(),name:'Mikron',dose:'20 ml / Lt',schedule:'30 günde bir',notes:'Mikro element takviyesi.'},
    {id:uid(),name:'Yosun / NPK / Humik',dose:'20 ml / Lt',schedule:'Her hafta (dönüşümlü)',notes:'Haftalık döngü: Yosun → NPK → Humik → NPK. Her hafta biri sulama suyuna karıştırılır.'},
    {id:uid(),name:'Derman + Hormon',dose:'1 tsp / Lt',schedule:'Haftada bir · en fazla 3 hafta',notes:'Yalnızca zayıf ağaçlarda. 3 hafta sonra birkaç ay dinlendir.'},
    {id:uid(),name:'Toz Mikoriza',dose:'—',schedule:'2 doz',notes:'İlk uygulamadan 1 ay sonra ikinci doz uygulanır. Toplam 2 doz.'},
    {id:uid(),name:'Trichoderma',dose:'—',schedule:'Saksı değişiminde',notes:'Yararlı kök mantarı. Her saksı değişiminde köke eklenir.'},
  ];
}
function seed(){
  return {trees:[], fertilizers:defaultFertilizers(), fertilizerNotes:'', fertLog:[], winter:false, vacation:false, lang:'tr',
    profile:{name:'',location:'',notes:'',avatar:null},
    backup:{remindEnabled:true,intervalDays:45,lastBackup:null,nextRemind:null},
    watering:{rotation:['Yosun','NPK','Humik','NPK'],mikronStart:todayISO(),nextDate:todayISO(),cycleIndex:0}, settings:{}};
}

/* ---------- taşıma / yükseltme ---------- */
function migrate(d){
  if(!d.trees) return d;
  d.trees.forEach(t=>{
    if(!Array.isArray(t.reminders)) t.reminders=[];
    if(!Array.isArray(t.history)) t.history=[];
    if(t.repotCycleYears==null || t.isPine==null){
      const s=((t.name||'')+' '+(t.species||'')).toLowerCase();
      let cyc=3, pine=false;
      if(/jwp|white pine|\bpine\b|pinus/.test(s)){cyc=4;pine=true;}
      else if(/elm|ulmus/.test(s)) cyc=2;
      else if(/shimpaku|juniper|ardıç/.test(s)) cyc=3;
      else if(/deshojo|katsura|acer|maple|akçaağaç/.test(s)) cyc=3;
      if(t.repotCycleYears==null) t.repotCycleYears=cyc;
      if(t.isPine==null) t.isPine=pine;
    }
    if(t.weak==null) t.weak = t.history.some(e=>e.category==='observe' && /zayıf|zayif|kuru/i.test((e.title||'')+(e.notes||'')));
    if(t.winter==null) t.winter=false;
    if(t.isPine) t.history.forEach(e=>{ if(e.category==='repot' && e.method==null) e.method = /shin/i.test((e.title||'')+(e.notes||''))?'shin':'roots'; });
  });
  if(!d.fertilizers) d.fertilizers=defaultFertilizers();
  if(d.fertilizerNotes==null) d.fertilizerNotes='';
  if(d.winter==null) d.winter=false;
  if(d.vacation==null) d.vacation=false;
  if(!d.lang) d.lang='tr';
  if(!d.watering) d.watering={rotation:['Yosun','NPK','Humik','NPK'],mikronStart:todayISO(),nextDate:todayISO(),cycleIndex:0};
  if(!Array.isArray(d.watering.rotation)||!d.watering.rotation.length) d.watering.rotation=['Yosun','NPK','Humik','NPK'];
  if(!d.watering.mikronStart) d.watering.mikronStart=todayISO();
  if(!d.watering.nextDate) d.watering.nextDate=todayISO();
  if(d.watering.cycleIndex==null) d.watering.cycleIndex=0;
  if(!Array.isArray(d.fertLog)) d.fertLog=[];
  if(!d.profile) d.profile={name:'',location:'',notes:'',avatar:null};
  if(!d.backup) d.backup={remindEnabled:true,intervalDays:45,lastBackup:null,nextRemind:null};
  if(d.backup.remindEnabled==null) d.backup.remindEnabled=true;
  if(!d.backup.intervalDays) d.backup.intervalDays=45;
  if(!d.settings) d.settings={};
  return d;
}

/* ---------- görsel küçültme ---------- */
function pickImage(cb,useCamera){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  if(useCamera) inp.capture='environment';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=e=>{ const img=new Image();
      img.onload=()=>{ const max=1100; let{width:w,height:h}=img;
        if(w>max||h>max){const k=Math.min(max/w,max/h);w=Math.round(w*k);h=Math.round(h*k);}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
        const du=cv.toDataURL('image/jpeg',0.72);
        if(window.__stashOriginal) window.__stashOriginal(du,f);
        cb(du); };
      img.src=e.target.result; };
    r.readAsDataURL(f); };
  inp.click();
}

/* ---------- kış / tatil ---------- */
function isWinter(t){ return !!data.winter || !!(t&&t.winter); }
function feedPaused(){ return !!data.winter || !!data.vacation; }
function feedPauseReason(){
  if(data.winter && data.vacation) return L('Kış + tatil modu açık — gübreleme hatırlatması kapalı','Winter + vacation mode on — feeding reminders off');
  if(data.winter) return L('Kış modu — gübreleme duraklatıldı (mevsimsel)','Winter mode — feeding paused (seasonal)');
  return L('Tatil modu — gübrelemeyi başka biri takip ediyor','Vacation mode — someone else is handling feeding');
}

/* ---------- yedek hatırlatması ---------- */
function backupDue(){ const b=data.backup; return !!(b && b.remindEnabled && b.nextRemind && todayISO()>=b.nextRemind); }

/* ---------- döngü / takvim ---------- */
function getTree(id){ return data.trees.find(t=>t.id===id); }
function lastRepot(t){ return [...t.history].filter(e=>e.category==='repot').sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0]||null; }
function lastRepotMethod(t){ const lr=lastRepot(t); return lr?lr.method:null; }
function nextRepotDate(t){ const lr=lastRepot(t); if(!lr||!t.repotCycleYears) return null; return addYears(lr.date, t.repotCycleYears); }
function cycleNote(t){ const lr=lastRepot(t); let s=L(`${t.repotCycleYears} yılda bir`,`every ${t.repotCycleYears} yrs`); if(lr) s+=L(` · son: ${yearOf(lr)}`,` · last: ${yearOf(lr)}`); if(t.isPine && lastRepotMethod(t)==='shin') s+=L(' · ⚠️ bu sefer shin yapma',' · ⚠️ no shin this time'); return s; }

function getTasks(){
  const tasks=[];
  data.trees.forEach(t=>{
    const nd=nextRepotDate(t);
    if(nd) tasks.push({treeId:t.id,treeName:displayName(t),date:nd,category:'repot',title:L('Saksı değişimi','Repotting'),notes:cycleNote(t),source:'cycle'});
    (t.reminders||[]).forEach(r=>{ if(!r.done) tasks.push({treeId:t.id,treeName:displayName(t),date:r.date,category:r.category,title:r.title,notes:r.notes,source:'manual',remId:r.id}); });
  });
  return tasks.filter(x=>x.date).sort((a,b)=>a.date.localeCompare(b.date));
}

/* ---------- gübreleme programı (onayla → +7 gün) ---------- */
function fertSchedule(count){
  const w=data.watering;
  const base=w.nextDate||todayISO();
  const rot=(w.rotation&&w.rotation.length)?w.rotation:['Yosun','NPK','Humik','NPK'];
  const ci=w.cycleIndex||0;
  const out=[];
  for(let i=0;i<(count||6);i++){
    const date=addDays(base,i*7);
    const item=rot[(((ci+i)%rot.length)+rot.length)%rot.length];
    let mikron=false;
    if(w.mikronStart){ const lo=diffDays(w.mikronStart,date), hi=diffDays(w.mikronStart,addDays(date,6)); let k=Math.ceil(lo/30); if(k<0)k=0; mikron=(30*k<=hi); }
    out.push({date,item,mikron,next:i===0,due:i===0 && date<=todayISO()});
  }
  return out;
}

/* ---------- tür & mevsimsel öneriler ---------- */
function treeKind(t){
  const s=((t.name||'')+' '+(t.species||'')).toLowerCase();
  if(t.isPine || /pine|pinus|jwp|jbp|çam/.test(s)) return 'pine';
  if(/juniper|juniperus|shimpaku|ardıç|ardic/.test(s)) return 'juniper';
  if(/maple|acer|deshojo|katsura|akçaağaç|akcaagac/.test(s)) return 'maple';
  if(/elm|ulmus|karaağaç|karaagac|zelkova/.test(s)) return 'elm';
  return 'general';
}

function seasonTips(t){
  const mo=new Date().getMonth()+1;
  const arr=SEASON_TIPS[treeKind(t)]||SEASON_TIPS.general;
  const hit=arr.filter(x=>x.m.includes(mo));
  return (hit.length?hit:arr).map(x=>L(x.tr,x.en));
}

/* telleme kontrol hatırlatıcısı için hafta seçimi */
function wireWeeks(){ const el=$('#f-wireweeks'); return el?Math.max(1,parseInt(el.value)||10):10; }

/* Derman+Hormon için tarih: gübreleme günlerinin her birinden en az 3 gün uzak,
   bugünden itibaren en yakın uygun gün (önce ya da sonra fark etmez, çakışmasın) */
function dermanDateFrom(startIso){
  const feeds = feedPaused() ? [] : fertSchedule(8).map(x=>x.date);
  for(let i=0;i<60;i++){
    const cand=addDays(startIso,i);
    if(cand>=todayISO() && feeds.every(f=>Math.abs(diffDays(cand,f))>=3)) return cand;
  }
  return addDays(startIso,3);
}
function dermanDate(){ return dermanDateFrom(todayISO()); }
/* Kür: haftada bir × 3 uygulama (gübre talimatındaki protokol), her doz gübre günlerinden ≥3 gün uzak */
function dermanCourse(){
  const dates=[]; let d=dermanDate();
  for(let k=0;k<3;k++){ dates.push(d); d=dermanDateFrom(addDays(d,7)); }
  return dates;
}

    <div class="row"><span>${L('Sıradaki saksı','Next repot')}</span><span class="v">${nd?fmtDate(nd):'—'}</span></div>
    ${t.isPine?`<div class="row"><span>${L('Çam · son yöntem','Pine · last method')}</span><span class="v">${lastRepotMethod(t)?methodLabel(lastRepotMethod(t)):'—'}</span></div>`:''}
    ${t.weak?`<div class="row"><span>${L('Durum','Status')}</span><span class="v" style="color:#e6b566">${L('Zayıf — Derman+Hormon uygun','Weak — tonic suitable')}</span></div>`:''}
  </div>`;
  const warnBanner = warnShin ? `<div class="warn">⚠️ ${L('Önceki saksı değişiminde shin temizliği yapıldı. Bir sonraki saksı değişiminde shin yapılmamalı — yalnızca genel kök temizliği önerilir.','Shin cleaning was done at the last repot. Do not do shin at the next repot — general root cleaning only.')}</div>` : '';
  const mine=getTasks().filter(x=>x.treeId===t.id);
  const list = mine.length ? `<div class="reminders">${mine.map(taskRow).join('')}</div>`
    : `<div class="empty"><div class="big">⏰</div>${L('Bu ağaç için planlı iş yok.','Nothing scheduled for this tree.')}</div>`;

  const kunyeRows=[];
  if(t.style) kunyeRows.push([L('Stil','Style'),t.style]);
  if(t.acquiredDate) kunyeRows.push([L('Ediniş','Acquired'),fmtDate(t.acquiredDate)]);
  if(t.acquiredFrom) kunyeRows.push([L('Kaynak','Source'),t.acquiredFrom]);
  if(t.estAge) kunyeRows.push([L('Tahmini yaş / köken','Est. age / origin'),t.estAge]);
  const kunyeCard = kunyeRows.length ? `<div class="cycle-card" style="background:var(--card);color:var(--ink);border:1px solid var(--line)">
    <h3 style="color:var(--muted)">${L('Künye','Profile')}</h3>
    ${kunyeRows.map(r=>`<div class="row" style="border-color:var(--line)"><span style="color:var(--muted)">${esc(r[0])}</span><span class="v">${esc(r[1])}</span></div>`).join('')}
  </div>` : '';

  const tips=seasonTips(t);
  const monthName=months()[new Date().getMonth()];
  const tipsCard = `<div class="info" style="border-left-color:var(--copper)"><b>🗓️ ${L('Mevsimsel öneriler','Seasonal tips')} · ${monthName}</b>
    <ul style="margin:6px 0 0;padding-left:18px">${tips.map(x=>`<li style="margin:3px 0">${esc(x)}</li>`).join('')}</ul>
    <div style="font-size:11px;color:var(--muted);margin-top:6px">${L('Genel rehber · kuzey yarımküre','General guidance · northern hemisphere')}</div></div>`;

  return `<div class="section-head" style="margin-top:0"><span class="eyebrow">${L('Yapılacaklar','To-do')}</span><h2 class="serif">${L('Gelecek plan','Future plan')}</h2></div>` + list
    + kunyeCard + cycle + warnBanner + tipsCard;
}

/* ---------- FOTOĞRAF İLERLEME GALERİSİ (yıl → mevsim → açı) ---------- */
function renderGallery(t){
  const gal=t.gallery||[];
  const angle=view.gAngle||'all';
  const chips=[['all',L('Tümü','All')]].concat(ANGLES.map(a=>[a.k,L(a.tr,a.en)]))
    .map(([k,l])=>`<button class="chip ${angle===k?'active':''}" data-gangle="${k}">${l}</button>`).join('');
  const bar=`<div class="chips">${chips}</div>
    <div style="margin:8px 0 14px"><button class="btn small primary" data-addgallery>＋ ${L('Fotoğraf ekle','Add photo')}</button></div>`;

  let content;
  if(angle!=='all'){
    const shots=gal.filter(g=>g.angle===angle).sort((a,b)=>(a.year-b.year)||(seasonIndex(a.season)-seasonIndex(b.season)));
    content = shots.length
      ? `<div class="info">${L('Kronolojik — bu açının zaman içindeki değişimi.','Chronological — this angle over time.')}</div>
         <div class="gallery">${shots.map(s=>`<figure class="shot"><img src="${s.image}" data-zoom ${s.remote?`data-fullkey="${t.id}|${s.id}"`:''} alt=""><figcaption><span class="gd">${s.year} · ${seasonLabel(s.season)}</span>${s.note?`<span class="gc">${esc(s.note)}</span>`:''}</figcaption></figure>`).join('')}</div>`
      : `<div class="empty"><div class="big">📷</div>${L('Bu açı için fotoğraf yok.','No photos for this angle.')}</div>`;
  } else {
    const years=[...new Set(gal.map(g=>g.year))].sort((a,b)=>b-a);
    content = years.length ? years.map(y=>`<div class="gyear"><h3 class="serif">${y}</h3>
      <div class="gseason-grid">
        <div></div>${ANGLES.map(a=>`<div class="gcolhead">${L(a.tr,a.en)}</div>`).join('')}
        ${SEASONS.map(s=>`<div class="gslabel">${L(s.tr,s.en)}</div>`+ANGLES.map(a=>{
          const slot=gal.find(g=>g.year===y&&g.season===s.k&&g.angle===a.k);
          return slot?`<div class="gslot" data-editgallery="${t.id}|${slot.id}"><img src="${slot.image}" alt=""></div>`
                     :`<div class="gslot empty" data-addgallery data-slot="${y}|${s.k}|${a.k}">＋</div>`;
        }).join('')).join('')}
      </div></div>`).join('')
      : `<div class="empty"><div class="big">📷</div>${L('Henüz galeri fotoğrafı yok. Yıl, mevsim ve açı (ön/arka/yan) seçerek her mevsim başı 4 açı, yılda 16 fotoğraf ekleyebilirsin.','No gallery photos yet. Pick year, season and angle (front/back/sides) to add 4 photos per season, 16 per year.')}</div>`;
  }

  const recs=t.history.filter(e=>e.image).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const recHTML = recs.length ? `<div class="section-head" style="margin-top:20px"><span class="eyebrow">${L('Kayıt fotoğrafları','Record photos')}</span><h2 class="serif">${L('Geçmişten','From records')}</h2></div>
    <div class="gallery">${recs.map(e=>`<figure class="shot"><img src="${e.image}" data-zoom alt=""><figcaption><span class="gd">${fmtDate(e.date,e.dateText)}</span><span class="gc">${esc(catLabel(e.category))}</span></figcaption></figure>`).join('')}</div>` : '';

  return bar + content + recHTML;
}

function galleryModal(treeId, opts){
  opts=opts||{}; const ex=opts.existing; const cy=new Date().getFullYear();
  const year=ex?ex.year:(opts.year||cy), season=ex?ex.season:(opts.season||'spring'), angle=ex?ex.angle:(opts.angle||'front');
  modalImage=ex?ex.image:null;
  openModal(`
    <h3 class="serif">${ex?L('Galeri fotoğrafı','Gallery photo'):L('Galeri fotoğrafı ekle','Add gallery photo')}</h3>
    <div class="field"><label>${L('Yıl','Year')}</label><input type="number" id="gm-year" value="${year}" min="1980" max="${cy+1}"></div>
    <div class="field"><label>${L('Mevsim','Season')}</label><select id="gm-season">${SEASONS.map(s=>`<option value="${s.k}" ${s.k===season?'selected':''}>${L(s.tr,s.en)}</option>`).join('')}</select></div>
    <div class="field"><label>${L('Açı','Angle')}</label><select id="gm-angle">${ANGLES.map(a=>`<option value="${a.k}" ${a.k===angle?'selected':''}>${L(a.tr,a.en)}</option>`).join('')}</select></div>
    <div class="field"><label>${L('Not (isteğe bağlı)','Note (optional)')}</label><input type="text" id="gm-note" value="${ex?esc(ex.note||''):''}"></div>
    <div class="field"><label>${L('Fotoğraf','Photo')}</label><div id="photoBox">${photoField(modalImage)}</div></div>
    <div class="modal-actions">
      ${ex?`<button class="btn danger" data-delgallery="${treeId}|${ex.id}">${L('Sil','Delete')}</button>`:''}
      <button class="btn" data-cancel>${L('Vazgeç','Cancel')}</button>
      <button class="btn primary" data-savegallery="${treeId}|${ex?ex.id:''}">${L('Kaydet','Save')}</button>
    </div>
    <div class="hint">${L('Aynı yıl+mevsim+açı yuvası tek fotoğraf tutar; yenisi eskisini değiştirir.','Each year+season+angle slot holds one photo; a new one replaces it.')}</div>`);
}
function saveGallery(key){
  const [treeId,id]=key.split('|'); const t=getTree(treeId);
  if(!modalImage){ toast(L('Fotoğraf gerekli','Photo required')); return; }
  const year=parseInt(rf('gm-year'))||new Date().getFullYear();
  const season=rf('gm-season'), angle=rf('gm-angle'), note=rf('gm-note').trim();
  t.gallery=(t.gallery||[]).filter(g=> g.id!==id && !(g.year===year&&g.season===season&&g.angle===angle));
  t.gallery.push({id:id||uid(),year,season,angle,image:modalImage,note});
  save(); closeModal(); render(); toast(L('Kaydedildi','Saved'));
}
function deleteGallery(key){ const [treeId,id]=key.split('|'); const t=getTree(treeId); t.gallery=(t.gallery||[]).filter(g=>g.id!==id); save(); closeModal(); render(); toast(L('Silindi','Deleted')); }

function renderGuide(){
  const diffLabel=d=>d==='beg'?L('Başlangıç','Beginner'):d==='int'?L('Orta','Intermediate'):L('İleri','Advanced');
  const seasKeys=[['spring',L('İlkbahar','Spring')],['summer',L('Yaz','Summer')],['autumn',L('Sonbahar','Autumn')],['winter',L('Kış','Winter')]];
  const nSpecies=FAMILIES.reduce((a,f)=>a+f.species.length,0);
  const cards=FAMILIES.map(f=>{
    const care=[[L('Konum / ışık','Position / light'),f.position],[L('Sulama','Watering'),f.water],[L('Saksı değişimi','Repotting'),f.repot],[L('Toprak','Soil'),f.soil]];
    const spHTML=f.species.map(s=>`
      <div class="sp">
        <div class="sp-name">${esc(s.sp)} <span class="sp-common">(${L(s.common.tr,s.common.en)})</span></div>
        <div class="sp-note">${L(s.note.tr,s.note.en)}</div>
        ${s.cultivars?`<div class="cv-list">${s.cultivars.map(c=>`<div class="cv"><span class="cv-n">‘${esc(c.name)}’</span> — ${L(c.note.tr,c.note.en)}</div>`).join('')}</div>`:''}
      </div>`).join('');
    return `<details class="guide-card fam-card">
      <summary>
        <div class="fam-line"><span class="fname">${esc(f.latin)}</span><span class="fcommon">(${L(f.common.tr,f.common.en)})</span><span class="chev">›</span></div>
        <div class="fam-meta">${L(f.type.tr,f.type.en)} · ${f.indoor?L('İç mekan','Indoor'):L('Dış mekan','Outdoor')} · ${L('Zorluk','Difficulty')}: <b class="fdiff">${diffLabel(f.diff).toLocaleUpperCase(data.lang==='en'?'en':'tr')}</b> · ${f.species.length} ${L('tür','species')}</div>
      </summary>
      <div class="guide-body">
        <div class="gsec">${L('Temel bakım','Core care')}</div>
        ${care.map(r=>`<div class="grow"><span class="gk">${esc(r[0])}</span><span>${L(r[1].tr,r[1].en)}</span></div>`).join('')}
        <div class="gsec">${L('Mevsim takvimi','Season calendar')}</div>
        ${seasKeys.map(([k,lab])=> (f.seasonal&&f.seasonal[k]) ? `<div class="grow"><span class="gk">${lab}</span><span>${L(f.seasonal[k].tr,f.seasonal[k].en)}</span></div>`:'').join('')}
        <div class="gsec">${L('Notlar','Notes')}</div>
        <div class="gnotes">${L(f.notes.tr,f.notes.en)}</div>
        <div class="gsec">${L('Türler & varyeteler','Species & varieties')}</div>
        ${spHTML}
      </div>
    </details>`;
  }).join('');
  return `
    <div class="tree-topbar">
      <button class="home-btn" data-home title="${L('Ana sayfa','Home')}">⌂</button>
      <span class="serif" style="font-size:19px;font-weight:600">${L('Tür Rehberi','Species Guide')}</span>
    </div>
    <div class="guide-head">
      <div class="gh-sub">${L('Bonsai bakım referansı','Bonsai care reference')}</div>
      <div class="gh-stats">${FAMILIES.length} ${L('familya','families')} · ${nSpecies} ${L('tür','species')} · ${L('mevsim takvimi & bakım notları','season calendar & care notes')}</div>
      <div class="gh-note">${L('Genel rehberdir; kendi iklim ve konumuna göre uyarlayın.','General guidance; adapt to your climate and location.')}</div>
    </div>
    ${cards}`;
}

function logRow(o, opts){
  opts=opts||{};
  const c=CATS[o.cat]||CATS.fertilize;
  const scope = o.scope==='tree'
    ? `<span class="scope-tag tree">${L('Bu ağaç','This tree')}</span>`
    : `<span class="scope-tag">${L('Tüm koleksiyon','Whole collection')}</span>`;
  const meta=[`<span class="pill" style="background:${c.hex}">${c.icon} ${esc(o.label)}</span>`,scope,
    `<span class="rem-date">📅 ${fmtDate(o.date,o.dateText)}</span>`,
    o.dose&&o.dose!=='—'?`<span style="color:var(--copper);font-weight:600">${esc(o.dose)}</span>`:'',
    o.mikron?`<span style="color:var(--copper)">+ Mikron</span>`:''].filter(Boolean).join(' ');
  return `<div class="rem-row" style="border-left-color:${c.hex}">
    <div class="rem-main"><div class="rem-meta" style="margin-top:0">${meta}</div>
      ${o.notes?`<div class="rem-meta" style="margin-top:4px">${esc(o.notes)}</div>`:''}</div>
    ${opts.editId?`<button class="log-edit" data-editlog="${opts.editId}">${L('Düzenle','Edit')}</button>`:''}
  </div>`;
}

function renderFertilizer(){
  const sched=fertSchedule(6);
  const weeksHTML = feedPaused()
    ? `<div class="week-card now" style="background:linear-gradient(135deg,#e8eef0,#dde7ea);border-color:#c7d3d8">
        <span style="font-size:22px">${data.winter?'❄️':'🏝️'}</span>
        <div style="flex:1"><div class="mix" style="color:#3a4a52">${feedPauseReason()}</div>
          <div class="wk">${L('Ana sayfadan kapatınca devam eder.','Turn off on the home screen to resume.')}</div></div>
      </div>`
    : sched.map(w=>`
      <div class="week-card ${w.next?'now':''}">
        ${w.next?`<input type="checkbox" class="week-check" data-confirmweek aria-label="${L('Gübrelemeyi tamamla','Complete feeding')}">`:`<span class="wk">${fmtDate(w.date)}</span>`}
        <div style="flex:1;min-width:0">
          <div class="mix">${esc(w.item)} · 20 ml/L${w.mikron?` <span style="color:var(--copper);font-size:12px;font-weight:600">+ Mikron</span>`:''}</div>

/* ---------- HAYAT AKIŞI (paylaşım & rapor): ediniş + saksı değişimleri + kritik kayıtlar ---------- */
/* Hayat akışına kendiliğinden giren kategoriler; diğerleri yalnızca ⚑ Kritik işaretliyse girer */
const STORY_CATS=['repot','wire','prune','defoliate','treatment','observe'];
function opsLabels(ops){ return (ops||[]).map(v=>{const o=REPOT_OPS.find(x=>x.v===v);return o?L(o.tr,o.en):v;}); }
function storyEvents(t){
  const ev=[];
  if(t.acquiredDate){
    const bits=[]; if(t.acquiredFrom) bits.push(L('Kaynak: ','Source: ')+t.acquiredFrom); if(t.estAge) bits.push(t.estAge);
    ev.push({date:t.acquiredDate,kind:'start',label:fmtDate(t.acquiredDate),title:L('Koleksiyona katıldı.','Joined the collection.'),notes:bits.join(' · ')});
  }
  (t.history||[]).forEach(e=>{
    const isRepot=e.category==='repot';
    if(!STORY_CATS.includes(e.category) && !e.critical) return;
    let title=e.title||catLabel(e.category);
    let detail='';
    if(isRepot){
      const parts=[]; if(e.method) parts.push(methodLabel(e.method)); parts.push(...opsLabels(e.ops));
      title=L('Saksı değişimi','Repotting'); detail=parts.join(', ');
    } else { title=catLabel(e.category)+': '+title; }
    ev.push({date:e.date||'',kind:isRepot?'repot':(e.category||'other'),label:fmtDate(e.date,e.dateText),title,detail,notes:(e.notes||'').replace(/\s+/g,' ').trim(),critical:!!e.critical});
  });
  return ev.sort((a,b)=>a.date.localeCompare(b.date));
}
function storyToday(t){
  const lr=lastRepot(t), nd=nextRepotDate(t);
  const pend=(t.reminders||[]).filter(r=>!r.done&&r.category!=='fertilize').sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  return {last:lr?fmtDate(lr.date,lr.dateText):'—', next:nd?fmtDate(nd):'—',
    status: t.weak?L('Zayıf · yakın takip','Weak · watch closely'):(isWinter(t)?L('Kış dinlenmesi','Winter rest'):L('Sağlıklı · aktif','Healthy · active')),
    pending: pend.length?pend.slice(0,2).map(r=>r.title+' · '+fmtDate(r.date)).join(' / '):'—'};
}
function buildStoryText(t){
  const ev=storyEvents(t), td=storyToday(t); const out=[];
  out.push('🌳 '+displayName(t)); 
  const sub=[t.species, (speciesDisplay(t)!==t.species?speciesDisplay(t):null), t.style].filter(Boolean).join(' · '); if(sub) out.push(sub);
  out.push('');
  out.push(L('HİKÂYESİ','LIFE STORY'));
  let y='';
  ev.forEach(e=>{ const yy=(e.date||'').slice(0,4); if(yy&&yy!==y){ y=yy; out.push(''); out.push('— '+y+' —'); }
    let ln='• '+e.label+' — '+e.title; if(e.detail) ln+=' ('+e.detail+')'; out.push(ln);
    if(e.notes) out.push('   '+e.notes); });
  if(!ev.length) out.push('—');
  out.push(''); out.push(L('BUGÜN','TODAY'));
  out.push(L('Son saksı: ','Last repot: ')+td.last+' · '+L('Sıradaki: ','Next: ')+td.next);
  out.push(L('Durum: ','Status: ')+td.status);
  if(td.pending!=='—') out.push(L('Bekleyen: ','Pending: ')+td.pending);
  out.push(''); out.push('Bonsai Daily · '+fmtDate(todayISO()));
  return out.join('\n');
}
function buildReport(t){
  const ev=storyEvents(t), td=storyToday(t);
  const byYear={}; ev.forEach(e=>{const y=(e.date||'').slice(0,4)||'—';(byYear[y]=byYear[y]||[]).push(e);});

        ${e.notes?`<div class="sn">${esc(e.notes)}</div>`:''}</div>`).join('')).join('')
    : `<div class="sn">${L('Henüz kayıt yok.','No events yet.')}</div>`;
  const photo = t.image?`<img class="rphoto" src="${t.image}" alt="">`:'';
  const metaBits=[];
  if(t.acquiredDate) metaBits.push(`${L('Ediniş','Acquired')}: <b>${fmtDate(t.acquiredDate)}</b>${t.acquiredFrom?' · '+esc(t.acquiredFrom):''}`);

  if(t.acquiredDate){ const yrs=Math.max(0,Math.floor(diffDays(t.acquiredDate,todayISO())/365)); metaBits.push(`${L('Bendeki süre','With me')}: <b>${yrs} ${L('yıl','yrs')}</b>`); }
  return `<div class="report-overlay"><div class="report-bar">
      <button class="btn" data-sharereport="${t.id}">📤 ${L('Paylaş','Share')}</button>
      ${isStandalone()
        ? `<button class="btn primary" data-opensafari="${t.id}">🧭 ${L('Safari’de aç (PDF)','Open in Safari (PDF)')}</button>`
        : `<button class="btn primary" data-print>🖨 ${L('Yazdır / PDF','Print / PDF')}</button>`}
      <button class="btn modal-x static" data-closereport aria-label="${L('Kapat','Close')}">✕</button>
    </div>
    <div class="report">
      <div class="skanji serif">盆栽日記 · BONSAI DAILY</div>
      <div class="rtop">${photo}<div>
        <h1 class="serif" style="margin:2px 0">${esc(displayName(t))}</h1>
        <div class="rsp" style="font-style:italic">${[t.species,(speciesDisplay(t)!==t.species?speciesDisplay(t):null),t.style].filter(Boolean).map(esc).join(' · ')}</div>
        <div class="smeta">${metaBits.map(b=>`<span>${b}</span>`).join('')}</div>
      </div></div>
      <hr class="srule">
      <div class="ssec">${L('Hikâyesi','Life story')}</div>
      <div class="slead">${L('Koleksiyona katıldığı günden bugüne başından geçenler: saksı değişimleri, telleme, budama, yapraksızlaştırma, tedavi/hastalık, gözlemler ve ⚑ kritik işaretli diğer kayıtlar. Gübreleme ve sulama rutinleri dahil değildir.','Everything that happened since it joined: repots, wiring, pruning, defoliation, treatment/illness, observations and any other entry marked ⚑ critical. Routine feeding and watering are not included.')}</div>
      ${tl}
      <div class="ssec">${L('Bugün','Today')}</div>
      <div class="sstatus">
        <div class="sst"><div class="k">${L('Son saksı','Last repot')}</div><div class="v">${esc(td.last)}</div></div>
        <div class="sst"><div class="k">${L('Sıradaki saksı','Next repot')}</div><div class="v">${esc(td.next)}</div></div>
        <div class="sst"><div class="k">${L('Durum','Status')}</div><div class="v">${esc(td.status)}</div></div>
        <div class="sst"><div class="k">${L('Bekleyen iş','Pending')}</div><div class="v">${esc(td.pending)}</div></div>
      </div>
      <div class="rfoot">${L('Bonsai Daily ile oluşturuldu','Generated with Bonsai Daily')} · ${fmtDate(todayISO())}</div>
    </div></div>`;
}
function isStandalone(){ return (window.navigator.standalone===true) || (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches); }

function methodGrid(sel){ const o=[['shin',L('Shin temizliği','Shin cleaning')],['roots',L('Genel kök temizliği','General root cleaning')]]; return `<div class="cat-grid">`+o.map(([k,l])=>`<button type="button" class="cat-opt ${sel===k?'active':''}" data-method="${k}" style="${sel===k?'background:#b5683c;':''}">${l}</button>`).join('')+`</div>`; }

];
function repotOpsField(){

}
function currentSeasonKey(){ const m=new Date().getMonth()+1; return (m>=3&&m<=5)?'spring':(m>=6&&m<=8)?'summer':(m>=9&&m<=11)?'autumn':'winter'; }
function displayName(t){ return (t.name&&t.name.trim())?t.name:speciesDisplay(t); }
function speciesDisplay(t){
  const s=(t.species||'').trim(); if(!s) return L('Tür belirtilmemiş','No species set');
  for(const f of FAMILIES){ const m=f.species.find(x=>x.sp.toLowerCase()===s.toLowerCase()); if(m) return L(m.common.tr,m.common.en); }
  return s;
}
function genusOptions(selIdx){
  return FAMILIES.map((f,i)=>{
    const c=f.common.tr===f.common.en?f.common.tr:`${f.common.tr} / ${f.common.en}`;
    return `<option value="${i}" ${i===selIdx?'selected':''}>${esc(f.latin)} (${esc(c)})</option>`;
  }).join('') + `<option value="other" ${selIdx==='other'?'selected':''}>${L('Diğer…','Other…')}</option>`;
}
function speciesOptions(fi,selIdx){
  if(fi==='other'||fi==null) return '';
  return FAMILIES[fi].species.map((s,i)=>{
    const c=s.common.tr===s.common.en?s.common.tr:`${s.common.tr} / ${s.common.en}`;
    return `<option value="${i}" ${i===selIdx?'selected':''}>${esc(s.sp)} (${esc(c)})</option>`;
  }).join('');
}
function matchSpecies(str){
  const s=(str||'').toLowerCase();
  for(let i=0;i<FAMILIES.length;i++){
    const si=FAMILIES[i].species.findIndex(x=>s.startsWith(x.sp.toLowerCase())||x.sp.toLowerCase().startsWith(s)&&s.length>3);
    if(si>=0) return {fi:i,si};
  }
  return null;
}
function genusDefaults(fi){
  if(fi==='other') return {cycle:3,pine:false};
  const lat=(FAMILIES[fi]?.latin||'').toLowerCase();
  return {cycle: lat.startsWith('pinus')?4 : (lat.startsWith('ulmus')||lat.startsWith('zelkova'))?2 : 3, pine: lat.startsWith('pinus')};
}
function faceBox(k){
  const a=ANGLES.find(x=>x.k===k); const img=modalPhotos[k];
  return `<div class="face">

    <div class="face-btns">

    </div>
    <div class="face-label">${L(a.tr,a.en)}</div>
  </div>`;
}

    else{
      $('#speciesRow').style.display=''; $('#speciesTxtRow').style.display='none';

      $('#t-cycle').value=d.cycle;
    }

/* ---------- kaydetme ---------- */
function rf(id){ const el=$('#'+id); return el?el.value:''; }

function saveEntry(existingId){
  const title=rf('f-title').trim(); if(!title){ toast(L('Başlık gerekli','Title required')); return; }
  const t=getTree(view.id);
  const obj={category:state.cat,title,date:rf('f-date')||todayISO(),dateText:rf('f-datetext').trim(),notes:rf('f-notes').trim(),image:modalImage,
    critical:!!$('#f-critical')?.checked,
    ops: state.cat==='repot' ? Array.from(document.querySelectorAll('.repotop:checked')).map(c=>c.value) : []};
  obj.method = (t.isPine && state.cat==='repot') ? (state.method||'roots') : null;
  if(existingId){ Object.assign(t.history.find(x=>x.id===existingId), obj); }
  else { t.history.push({id:uid(),...obj}); }
  if(state.cat==='treatment' && $('#f-followup')?.checked){
    (t.reminders=t.reminders||[]).push({id:uid(),category:'treatment',title:title+L(' (2. doz)',' (2nd dose)'),date:addDays(obj.date,30),notes:L('İkinci doz','Second dose'),done:false});
  }
  if(state.cat==='wire' && $('#f-wirecheck')?.checked){
    const wks=wireWeeks();
    (t.reminders=t.reminders||[]).push({id:uid(),category:'wire',title:L('Tel kontrolü / çıkarma','Wire check / removal'),date:addDays(obj.date,wks*7),notes:L('Tel gömülmesin diye kontrol et.','Check so the wire does not bite in.'),done:false});
  }
  save(); closeModal(); render(); toast(L('Kayıt kaydedildi','Entry saved'));
}
function deleteEntry(id){ if(!confirm(L('Bu kaydı silmek istediğine emin misin?','Delete this entry?'))) return; const t=getTree(view.id); t.history=t.history.filter(x=>x.id!==id); save(); closeModal(); render(); toast(L('Silindi','Deleted')); }

function saveReminder(treeId){
  const title=rf('f-title').trim(); if(!title){ toast(L('Başlık gerekli','Title required')); return; }
  const t=getTree(treeId); (t.reminders=t.reminders||[]).push({id:uid(),category:state.cat,title,date:rf('f-date')||todayISO(),notes:rf('f-notes').trim(),done:false});
  save(); closeModal(); render(); toast(L('Hatırlatıcı eklendi','Reminder added'));
}
function deleteReminder(key){ const [treeId,remId]=key.split('|'); const t=getTree(treeId); t.reminders=(t.reminders||[]).filter(r=>r.id!==remId); save(); render(); toast(L('Silindi','Deleted')); }

function logRepot(treeId){
  const t=getTree(treeId);
  const obj={id:uid(),category:'repot',title:L('Saksı değişimi','Repotting'),date:rf('f-date')||todayISO(),dateText:'',notes:rf('f-notes').trim(),image:modalImage,method:t.isPine?(state.method||'roots'):null};
  t.history.push(obj);
  save(); closeModal(); render(); toast(L('Saksı değişimi işlendi','Repotting logged')+' · '+addYears(obj.date,t.repotCycleYears).slice(0,4));
}
function logRem(key){
  const [treeId,remId]=key.split('|'); const t=getTree(treeId); const r=(t.reminders||[]).find(x=>x.id===remId);
  const title=rf('f-title').trim()||(r?r.title:L('İşlem','Task'));
  const obj={id:uid(),category:state.cat,title,date:rf('f-date')||todayISO(),dateText:'',notes:rf('f-notes').trim(),image:modalImage,
    critical:!!$('#f-critical')?.checked,
    ops: state.cat==='repot' ? Array.from(document.querySelectorAll('.repotop:checked')).map(c=>c.value) : []};
  if(t.isPine && state.cat==='repot') obj.method=state.method||'roots';
  t.history.push(obj);
  if(state.cat==='treatment' && $('#f-followup')?.checked){
    (t.reminders=t.reminders||[]).push({id:uid(),category:'treatment',title:title+L(' (2. doz)',' (2nd dose)'),date:addDays(obj.date,30),notes:L('İkinci doz','Second dose'),done:false});
  }
  if(state.cat==='wire' && $('#f-wirecheck')?.checked){
    const wks=wireWeeks();
    (t.reminders=t.reminders||[]).push({id:uid(),category:'wire',title:L('Tel kontrolü / çıkarma','Wire check / removal'),date:addDays(obj.date,wks*7),notes:'',done:false});
  }
  t.reminders=(t.reminders||[]).filter(x=>x.id!==remId);
  save(); closeModal(); render(); toast(L('Geçmişe işlendi','Logged to history'));
}

function saveTree(existingId){
  const name=rf('t-name').trim();
  const gsel=$('#t-genus').value;
  if(gsel==='other' && !rf('t-species-txt').trim() && !name){ toast(L('Tür ya da isim gir','Enter a species or a name')); return; }
  let species='';
  if(gsel==='other'){ species=rf('t-species-txt').trim(); }
  else { const f=FAMILIES[parseInt(gsel)]; const s=f.species[parseInt($('#t-species-sel').value)||0]; species=s?s.sp:f.latin; }
  const styleSel=$('#t-style-sel')?$('#t-style-sel').value:'';
  const style = styleSel==='__other' ? (rf('t-style-txt').trim()) : styleSel;
  const isPine = gsel!=='other' && (FAMILIES[parseInt(gsel)]?.latin||'').toLowerCase().startsWith('pinus');
  const prevWeak = existingId ? !!getTree(existingId).weak : false;
  const obj={name,species,style,repotCycleYears:parseInt(rf('t-cycle'))||3,isPine,weak:prevWeak,
    acquiredDate:rf('t-acqdate'),acquiredFrom:rf('t-acqfrom').trim(),estAge:rf('t-age').trim()};

  let t;
  if(existingId){ t=getTree(existingId); Object.assign(t,obj); }
  else { t={id:uid(),history:[],reminders:[],gallery:[],winter:false,image:null,...obj}; data.trees.push(t); }

  if(modalPhotos.front) t.image=modalPhotos.front;
  const y=new Date().getFullYear(), sk=currentSeasonKey();
  ANGLES.forEach(a=>{
    const img=modalPhotos[a.k]; if(!img) return;
    t.gallery=(t.gallery||[]).filter(g=>!(g.year===y&&g.season===sk&&g.angle===a.k));
    t.gallery.push({id:uid(),year:y,season:sk,angle:a.k,image:img,note:existingId?'':L('Künye','Registry')});
  });

  if(!existingId){
    const lrDate=rf('t-lastrepot');
    if(lrDate){
      const ops=Array.from(document.querySelectorAll('.repotop:checked')).map(c=>c.value);
      const opLabels=ops.map(v=>{const o=REPOT_OPS.find(x=>x.v===v);return o?L(o.tr,o.en):v;});
      const method = ops.includes('shin')?'shin' : (ops.includes('roots')?'roots':null);
      const base=L('Künye kaydı — bilinen son saksı değişimi. Döngü bu tarihten başlar.','Registry — last known repot. Cycle starts from this date.');
      const notes = opLabels.length ? base+' · '+opLabels.join(', ') : base;
      t.history.push({id:uid(),date:lrDate,dateText:'',category:'repot',title:L('Saksı değişimi','Repot'),notes,method,image:null,ops,critical:false});
    }
  }
  save(); closeModal(); render(); toast(L('Künye kaydedildi','Registry saved'));
}
function deleteTree(id){ if(!confirm(L('Bu ağacı ve tüm geçmişini silmek istediğine emin misin?','Delete this tree and all its history?'))) return; data.trees=data.trees.filter(t=>t.id!==id); save(); view={name:'home'}; closeModal(); render(); toast(L('Silindi','Deleted')); }

function saveFert(existingId){
  const name=rf('g-name').trim(); if(!name){ toast(L('İsim gerekli','Name required')); return; }
  const obj={name,dose:rf('g-dose').trim(),schedule:rf('g-sched').trim(),notes:rf('g-notes').trim()};
  if(existingId){ Object.assign(data.fertilizers.find(f=>f.id===existingId),obj); } else { data.fertilizers.push({id:uid(),...obj}); }
  save(); closeModal(); render(); toast(L('Kaydedildi','Saved'));
}
function deleteFert(id){ if(!confirm(L('Silinsin mi?','Delete?'))) return; data.fertilizers=data.fertilizers.filter(f=>f.id!==id); save(); closeModal(); render(); toast(L('Silindi','Deleted')); }

function saveWater(){
  data.watering.nextDate=rf('w-start')||todayISO();
  data.watering.mikronStart=rf('w-mikron')||todayISO();
  data.watering.rotation=rf('w-rot').split(',').map(s=>s.trim()).filter(Boolean);
  if(!data.watering.rotation.length) data.watering.rotation=['Yosun','NPK','Humik','NPK'];
  if(data.watering.cycleIndex>=data.watering.rotation.length) data.watering.cycleIndex=0;
  save(); closeModal(); render(); toast(L('Program güncellendi','Schedule updated'));
}
function saveWaterLog(){
  const date=rf('w-date')||todayISO();
  const excluded=data.trees.filter(t=>isWinter(t)).map(t=>t.id);
  data.fertLog.push({id:uid(),date,item:rf('w-item').trim()||L('Gübreleme','Feeding'),dose:rf('w-dose').trim()||'20 ml / Lt',mikron:!!$('#w-mikron')?.checked,notes:rf('w-notes').trim(),excluded});
  const rotLen=(data.watering.rotation&&data.watering.rotation.length)||4;
  data.watering.cycleIndex=(((data.watering.cycleIndex||0)+1)%rotLen+rotLen)%rotLen;
  data.watering.nextDate=addDays(date,7);
  save(); closeModal(); render(); toast(L('Gübreleme işlendi · sıradaki','Feeding logged · next')+' '+fmtDate(addDays(date,7)));
}
function saveLog(existingId){
  const obj={date:rf('l-date')||todayISO(),item:rf('l-item').trim()||L('Gübreleme','Feeding'),dose:rf('l-dose').trim(),mikron:!!$('#l-mikron')?.checked,notes:rf('l-notes').trim()};
  if(existingId){ Object.assign((data.fertLog||[]).find(x=>x.id===existingId),obj); }
  else { (data.fertLog=data.fertLog||[]).push({id:uid(),...obj}); }
  save(); closeModal(); render(); toast(L('Kaydedildi','Saved'));
}
function deleteLog(id){ if(!confirm(L('Silinsin mi?','Delete?'))) return; data.fertLog=(data.fertLog||[]).filter(x=>x.id!==id); save(); closeModal(); render(); toast(L('Silindi','Deleted')); }

/* ---------- foto / yedek ---------- */
function lightbox(src,fullkey){ const lb=document.createElement('div'); lb.className='lightbox'; lb.innerHTML=`<img src="${src}" alt="">`; lockScroll(); lb.onclick=()=>{ lb.remove(); unlockScroll(); }; document.body.appendChild(lb);
  if(fullkey && typeof loadFullImage==='function') loadFullImage(fullkey, lb.querySelector('img')); }
function exportData(){ const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`bonsai-daily-${todayISO()}.json`; a.click(); URL.revokeObjectURL(a.href);
  data.backup=data.backup||{remindEnabled:true,intervalDays:45}; data.backup.lastBackup=todayISO(); data.backup.nextRemind=addDays(todayISO(),data.backup.intervalDays||45); save(); render(); toast(L('Yedek indirildi','Backup downloaded')); }
function importData(){ const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const r=new FileReader();
    r.onload=e=>{ try{ const obj=JSON.parse(e.target.result); if(!obj.trees) throw 0;
        if(!confirm(L('Mevcut veriler bu yedekle değiştirilecek. Devam?','Current data will be replaced by this backup. Continue?'))) return;
        data=migrate(obj); save(); closeModal(); view={name:'home'}; render(); toast(L('Yedek geri yüklendi','Backup restored'));
      }catch(err){ toast(L('Dosya okunamadı','Could not read file')); } };
    r.readAsText(f); };
  inp.click();
}
function taskKey(prefix,id,date){ return (prefix+':'+id+':'+date).replace(/[^A-Za-z0-9:_-]/g,''); }
function exportICS(){
  data.icsExported = data.icsExported || [];
  const done=new Set(data.icsExported);
  const today=todayISO(); const items=[];
  if(data.watering && data.watering.nextDate && data.watering.nextDate>=today && !feedPaused()){
    items.push({key:taskKey('water','mix',data.watering.nextDate), date:data.watering.nextDate,
      title:L('Gübreleme günü','Feeding day'), desc:L('Sulama karışımı programı (Bonsai Daily)','Watering mix schedule (Bonsai Daily)')});
  }
  getTasks().forEach(x=>{
    if(!x.date || x.date<today) return;
    const key = x.source==='manual' ? taskKey('rem',x.remId,x.date) : taskKey('repot',x.treeId,x.date);
    items.push({key, date:x.date, title:x.title+(x.treeName?' — '+x.treeName:''), desc:x.notes||''});
  });
  const fresh=items.filter(it=>!done.has(it.key));
  if(!fresh.length){ toast(L('Yeni görev yok — hepsi daha önce aktarıldı','Nothing new — all tasks already exported')); return; }
  const escT=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
  const dnum=d=>d.replace(/-/g,'');
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Bonsai Daily//TR\r\nCALSCALE:GREGORIAN\r\nX-WR-CALNAME:Bonsai Daily\r\n';
  fresh.slice(0,200).forEach(it=>{
    ics+='BEGIN:VEVENT\r\nUID:'+it.key+'@bonsai-logbook\r\nDTSTAMP:'+stamp+'\r\nDTSTART;VALUE=DATE:'+dnum(it.date)+'\r\nSUMMARY:'+escT('🌳 '+it.title)+'\r\n';
    if(it.desc) ics+='DESCRIPTION:'+escT(it.desc)+'\r\n';
    ics+='BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:'+escT(it.title)+'\r\nTRIGGER:PT9H\r\nEND:VALARM\r\nEND:VEVENT\r\n';
  });
  ics+='END:VCALENDAR\r\n';
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='bonsai-gorevler-'+todayISO()+'.ics'; a.click(); URL.revokeObjectURL(a.href);
  fresh.slice(0,200).forEach(it=>{ if(!done.has(it.key)) data.icsExported.push(it.key); });
  if(data.icsExported.length>600) data.icsExported=data.icsExported.slice(-600);
  save();
  toast(L(fresh.length+' yeni görev takvime aktarıldı','Exported '+fresh.length+' new task(s) to calendar'));
}
document.addEventListener('click', e=>{ const el=e.target.closest('[data-export],[data-import],[data-exportics],[data-icsreset]');
  if(el?.hasAttribute('data-export')) exportData();
  else if(el?.hasAttribute('data-import')) importData();
  else if(el?.hasAttribute('data-exportics')) exportICS();
  else if(el?.hasAttribute('data-icsreset')){ if(confirm(L('Aktarım geçmişi sıfırlansın mı? Bir sonraki aktarımda tüm gelecek görevler yeniden dahil edilir.','Reset export history? The next export will include all upcoming tasks again.'))){ data.icsExported=[]; save(); toast(L('Sıfırlandı','Reset')); } }
});

/* ---------- IndexedDB: tüm veri bloğu burada yaşar (kota ~GB) ---------- */
const IDB_NAME='bonsai_idb';
function idbOpen(){ return new Promise((res,rej)=>{ const q=indexedDB.open(IDB_NAME,1);
  q.onupgradeneeded=()=>q.result.createObjectStore('kv');
  q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
async function idbGet(k){ try{ const db=await idbOpen(); return await new Promise((res,rej)=>{ const t=db.transaction('kv','readonly').objectStore('kv').get(k); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); }); }catch(e){ return undefined; } }
async function idbSet(k,v){ try{ const db=await idbOpen(); return await new Promise((res,rej)=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }catch(e){} }
async function idbDel(k){ try{ const db=await idbOpen(); return await new Promise((res,rej)=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').delete(k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }catch(e){} }
async function idbKeys(){ try{ const db=await idbOpen(); return await new Promise((res,rej)=>{ const t=db.transaction('kv','readonly').objectStore('kv').getAllKeys(); t.onsuccess=()=>res(t.result||[]); t.onerror=()=>rej(t.error); }); }catch(e){ return []; } }

/* Dropbox bağlıyken: seçilen fotoğrafın ORİJİNALİ IndexedDB'de bekletilir,
   eşitlemede Dropbox'a orijinal çözünürlükte yüklenir. Uygulama içi görüntü
   küçültülmüş kopyadır (hız + data.json boyutu için). */
window.__stashOriginal=function(dataUrl, file){

};

/* ---------- Dropbox durumu (yedek JSON'a girmez; ayrı saklanır) ---------- */
function appUrl(){
  let p=location.pathname;
  if(p.endsWith('/index.html')) p=p.slice(0,-'index.html'.length);
  return location.origin+p;
}
const DBX_KEY='bonsai_dropbox_v1';
let dbx = (function(){ try{ const r=localStorage.getItem(DBX_KEY); if(r) return JSON.parse(r);}catch(e){} return {appKey:'',refreshToken:'',accessToken:'',exp:0,synced:{},treeFolders:{},lastSync:null}; })();
function dbxSave(){ try{ localStorage.setItem(DBX_KEY, JSON.stringify(dbx)); }catch(e){} idbSet('dropbox',dbx); }
function dbxConnected(){ return !!(dbx.appKey && dbx.refreshToken); }

function dbxSectionHTML(){

      'Once connected, all data mirrors to Dropbox in a folder structure and updates on every save. Create an app in the Dropbox App Console, enter its App key; add this Redirect URI:')}</p>

/* ---------- OAuth (PKCE, sunucusuz) ---------- */
function b64url(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
async function dbxStartAuth(){
  const key=(rf('dbx-appkey')||'').trim(); if(!key){ toast(L('App key gerekli','App key required')); return; }
  dbx.appKey=key; dbxSave();
  const verifier=b64url(crypto.getRandomValues(new Uint8Array(48)));
  sessionStorage.setItem('dbx_verifier',verifier);
  const challenge=b64url(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)));
  const uri=encodeURIComponent(appUrl());
  location.href=`https://www.dropbox.com/oauth2/authorize?client_id=${encodeURIComponent(key)}&response_type=code&code_challenge=${challenge}&code_challenge_method=S256&token_access_type=offline&redirect_uri=${uri}`;
}
async function dbxHandleCallback(){
  const p=new URLSearchParams(location.search); const code=p.get('code');
  if(!code) return false;
  const verifier=sessionStorage.getItem('dbx_verifier');
  history.replaceState(null,'',location.pathname);
  if(!verifier||!dbx.appKey) return false;
  try{
    const body=new URLSearchParams({code,grant_type:'authorization_code',code_verifier:verifier,client_id:dbx.appKey,redirect_uri:appUrl()});
    const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',body});
    const j=await r.json();
    if(j.access_token){
      dbx.accessToken=j.access_token; dbx.refreshToken=j.refresh_token||dbx.refreshToken;
      dbx.exp=Date.now()+((j.expires_in||14000)-120)*1000; dbx.synced={}; dbxSave();
      toast(L('Dropbox bağlandı — ilk aktarım başlıyor…','Dropbox connected — initial upload starting…'));
      dbxSyncAll(true);
      return true;
    }
  }catch(e){}
  toast(L('Dropbox bağlantısı başarısız','Dropbox connection failed'));
  return false;
}
async function dbxToken(){
  if(!dbxConnected()) return null;
  if(dbx.accessToken && Date.now()<dbx.exp) return dbx.accessToken;
  try{
    const body=new URLSearchParams({grant_type:'refresh_token',refresh_token:dbx.refreshToken,client_id:dbx.appKey});
    const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',body});
    const j=await r.json();
    if(j.access_token){ dbx.accessToken=j.access_token; dbx.exp=Date.now()+((j.expires_in||14000)-120)*1000; dbxSave(); return dbx.accessToken; }
  }catch(e){}
  return null;
}

/* ---------- Dropbox dosya işlemleri ---------- */
async function dbxUpload(path, blobOrText){
  const tok=await dbxToken(); if(!tok) throw 0;
  const body=(blobOrText instanceof Blob)?blobOrText:new Blob([blobOrText],{type:'text/plain;charset=utf-8'});
  const r=await fetch('https://content.dropboxapi.com/2/files/upload',{method:'POST',headers:{
    'Authorization':'Bearer '+tok,
    'Dropbox-API-Arg':JSON.stringify({path,mode:'overwrite',mute:true}).replace(/[\u007f-\uffff]/g,c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0')),
    'Content-Type':'application/octet-stream'},body});
  if(!r.ok) throw new Error('upload '+r.status);
}
async function dbxDownload(path){
  const tok=await dbxToken(); if(!tok) throw 0;
  const r=await fetch('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{
    'Authorization':'Bearer '+tok,
    'Dropbox-API-Arg':JSON.stringify({path}).replace(/[\u007f-\uffff]/g,c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0'))}});
  if(!r.ok) throw new Error('download '+r.status);
  return r;
}
async function dbxDelete(path){
  const tok=await dbxToken(); if(!tok) return;
  try{ await fetch('https://api.dropboxapi.com/2/files/delete_v2',{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({path})}); }catch(e){}
}

/* ---------- ayna yapısı ---------- */
const DBX_ROOT='/Bonsai Daily';
function safeName(s){ return (s||'').replace(/[\\\/:*?"<>|]/g,'-').replace(/\s+/g,' ').trim().slice(0,60)||'Agac'; }
function treeFolder(t){
  let base=safeName(t.name||speciesDisplay(t));
  const taken=Object.entries(dbx.treeFolders).some(([id,f])=>id!==t.id&&f===base);
  if(taken) base=base+' ('+t.id.slice(-4)+')';
  return base;
}
function strHash(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; } return h.toString(36)+':'+s.length; }
function dataURLtoBlob(u){ const m=u.match(/^data:(.*?);base64,(.*)$/); if(!m) return new Blob([u]); const bin=atob(m[2]); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i); return new Blob([arr],{type:m[1]}); }

function buildKunyeText(t){
  const lines=[];
  lines.push('BONSAI DAILY — KÜNYE');
  lines.push('======================');
  lines.push((L('Ağaç','Tree'))+': '+(t.name||'—'));
  lines.push((L('Tür','Species'))+': '+(t.species||'—')+(speciesDisplay(t)!==t.species?' ('+speciesDisplay(t)+')':''));
  if(t.style) lines.push('Stil / Style: '+t.style);
  if(t.acquiredDate) lines.push(L('Ediniş','Acquired')+': '+fmtDate(t.acquiredDate)+(t.acquiredFrom?' — '+t.acquiredFrom:''));
  if(t.estAge) lines.push(L('Tahmini yaş / köken','Est. age / origin')+': '+t.estAge);
  lines.push(L('Saksı döngüsü','Repot cycle')+': '+(t.repotCycleYears||3)+' '+L('yıl','yrs'));
  const nd=nextRepotDate(t); if(nd) lines.push(L('Sıradaki saksı','Next repot')+': '+fmtDate(nd));
  lines.push('');
  lines.push(L('KRONOLOJİK KAYITLAR','CHRONOLOGICAL RECORDS'));
  lines.push('----------------------');
  const hist=[...(t.history||[])].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  if(!hist.length) lines.push('—');
  hist.forEach(e=>{
    let ln=(e.date||e.dateText||'????')+' — '+catLabel(e.category)+' — '+(e.title||'');
    if(e.method) ln+=' ['+methodLabel(e.method)+']';
    if(e.notes) ln+=' · '+e.notes.replace(/\s+/g,' ');
    lines.push(ln);
  });
  const rems=(t.reminders||[]).filter(r=>!r.done);
  if(rems.length){
    lines.push('');
    lines.push(L('BEKLEYEN HATIRLATICILAR','PENDING REMINDERS'));
    lines.push('----------------------');
    rems.sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(r=>lines.push((r.date||'')+' — '+r.title+(r.notes?' · '+r.notes:'')));
  }
  lines.push('');
  lines.push(L('Oluşturma','Generated')+': '+todayISO()+' · Bonsai Daily');
  return lines.join('\n');
}

const ANGLE_FILE={front:'on',back:'arka',side1:'sag',side2:'sol'};
const SEASON_DIR={spring:'İlkbahar',summer:'Yaz',autumn:'Sonbahar',winter:'Kış'};

/* küçük önizleme üret (grid/cache için) */
function makeThumb(dataUrl,max,q){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{ let{width:w,height:h}=img;
      if(w>max||h>max){const k=Math.min(max/w,max/h);w=Math.round(w*k);h=Math.round(h*k);}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      res(cv.toDataURL('image/jpeg',q||0.55)); };
    img.onerror=()=>res(dataUrl);
    img.src=dataUrl;
  });
}
/* bir galeri fotoğrafının Dropbox yolu (eşitlemeyle aynı format) */
function galleryPath(t,g){
  const folder=dbx.treeFolders[t.id]||treeFolder(t);
  return `${DBX_ROOT}/${folder}/Galeri/${g.year}/${SEASON_DIR[g.season]||g.season}/${ANGLE_FILE[g.angle]||g.angle}.${g.ext||'jpg'}`;
}
/* tam boyutu Dropbox'tan getir (oturum içi önbellekli) */
const __fullCache={};
async function loadFullImage(fullkey,imgEl){
  const [tid,gid]=fullkey.split('|'); const t=getTree(tid); if(!t) return;
  const g=(t.gallery||[]).find(x=>x.id===gid); if(!g||!g.remote) return;
  const path=galleryPath(t,g);
  try{
    if(!__fullCache[path]){
      const r=await dbxDownload(path);
      __fullCache[path]=URL.createObjectURL(await r.blob());
    }
    if(imgEl&&imgEl.isConnected) imgEl.src=__fullCache[path];
  }catch(e){ toast(L('Tam boyut yüklenemedi — çevrimdışı olabilirsin','Full size unavailable — you may be offline')); }
}

let __dbxBusy=false;
async function dbxSyncAll(force){
  if(!dbxConnected()||__dbxBusy) return;
  __dbxBusy=true;
  let up=0, fail=0, shrunk=false;
  try{
    for(const t of data.trees){
      const folder=treeFolder(t);
      const old=dbx.treeFolders[t.id];
      if(old && old!==folder){ await dbxDelete(DBX_ROOT+'/'+old); Object.keys(dbx.synced).forEach(k=>{ if(k.startsWith(DBX_ROOT+'/'+old+'/')) delete dbx.synced[k]; }); }
      dbx.treeFolders[t.id]=folder;
      const kp=`${DBX_ROOT}/${folder}/Künye/kunye.txt`;
      const ktext=buildKunyeText(t); const kh=strHash(ktext);
      if(force||dbx.synced[kp]!==kh){ try{ await dbxUpload(kp,ktext); dbx.synced[kp]=kh; up++; }catch(e){ fail++; } }
      for(const g of (t.gallery||[])){
        if(!g.image) continue;
        const gh=strHash(g.image.slice(0,80)+g.image.length);
        if(force||dbx.synced['g:'+g.id]!==gh){
          try{
            const orig=await idbGet('orig:'+gh);
            const blob=orig||dataURLtoBlob(g.image);
            const ext=(blob.type==='image/png')?'png':(blob.type==='image/heic'||blob.type==='image/heif')?'heic':'jpg';
            g.ext=ext;
            const gp=`${DBX_ROOT}/${folder}/Galeri/${g.year}/${SEASON_DIR[g.season]||g.season}/${ANGLE_FILE[g.angle]||g.angle}.${ext}`;
            await dbxUpload(gp,blob);
            if(ext!=='jpg') await dbxDelete(gp.replace(/\.[a-z]+$/,'.jpg'));
            g.remote=true;
            if(orig) idbDel('orig:'+gh);
            /* yerelde yalnız küçük önizleme kalsın — tam boyut artık Dropbox'ta */
            if(g.image.length>90000){ g.image=await makeThumb(g.image,340,0.55); shrunk=true; }
            dbx.synced['g:'+g.id]=strHash(g.image.slice(0,80)+g.image.length);
            up++;
          }catch(e){ fail++; }
        }
      }
    }
    if(shrunk){ try{ localStorage.setItem(STORE_KEY,JSON.stringify(data)); }catch(e){} idbSet('data',data); if(view.name==='tree') render(); }
    const dj=JSON.stringify(data); const djh=strHash(dj);
    const dp=DBX_ROOT+'/data.json';
    if(force||dbx.synced[dp]!==djh){ try{ await dbxUpload(dp,new Blob([dj],{type:'application/json'})); dbx.synced[dp]=djh; up++; }catch(e){ fail++; } }
    dbx.lastSync=todayISO(); dbxSave();
    try{ /* eşitleme sonrası: artık hiçbir galeri fotoğrafına ait olmayan bekletilmiş orijinalleri temizle */
      const live=new Set();
      data.trees.forEach(t=>(t.gallery||[]).forEach(g=>{ if(g.image) live.add('orig:'+strHash(g.image.slice(0,80)+g.image.length)); }));
      (await idbKeys()).forEach(k=>{ if(typeof k==='string'&&k.startsWith('orig:')&&!live.has(k)) idbDel(k); });
    }catch(e){}
    if(up) toast(fail?L(`Eşitlendi (${up} dosya, ${fail} hata)`,`Synced (${up} files, ${fail} errors)`):L(`Dropbox eşitlendi (${up} dosya)`,`Dropbox synced (${up} files)`));
    else if(force!==undefined&&force!==true&&!fail){} /* sessiz */
  }catch(e){ toast(L('Dropbox eşitleme hatası','Dropbox sync error')); }
  __dbxBusy=false;
}
let __dbxTimer=null;
function queueDbxSync(){ if(!dbxConnected()) return; clearTimeout(__dbxTimer);
  __dbxTimer=setTimeout(()=>{ if(__dbxBusy){ queueDbxSync(); return; } dbxSyncAll(false); },4000); }

async function dbxRestore(){
  if(!confirm(L('Dropbox’taki data.json ile mevcut veriler DEĞİŞTİRİLECEK. Devam?','Current data will be REPLACED by data.json from Dropbox. Continue?'))) return;
  try{
    const r=await dbxDownload(DBX_ROOT+'/data.json');
    const obj=JSON.parse(await r.text());
    if(!obj.trees) throw 0;
    data=migrate(obj); save(); closeModal(); view={name:'home'}; render();
    toast(L('Dropbox’tan geri yüklendi','Restored from Dropbox'));
  }catch(e){ toast(L('Geri yükleme başarısız — data.json bulunamadı','Restore failed — data.json not found')); }
}
function dbxDisconnect(){
  if(!confirm(L('Dropbox bağlantısı kesilsin mi? Dropbox’taki dosyalar silinmez.','Disconnect Dropbox? Files on Dropbox are kept.'))) return;
  dbx={appKey:dbx.appKey,refreshToken:'',accessToken:'',exp:0,synced:{},treeFolders:{},lastSync:null}; dbxSave();
  const box=$('#dbxBox'); if(box) box.innerHTML=dbxSectionHTML();
  toast(L('Bağlantı kesildi','Disconnected'));
}

/* ---------- kayıt sonrası kanca: IndexedDB + Dropbox ---------- */
window.__afterSave=function(){ idbSet('data',data); queueDbxSync(); };

/* ---------- depolama açılışı ---------- */
(async function storageBoot(){
  try{
    const idata=await idbGet('data');
    if(idata && idata.trees){
      const cur=JSON.stringify(data), inc=JSON.stringify(idata);
      if(inc!==cur){ data=migrate(idata); render(); }
    } else {
      idbSet('data',data); // localStorage'dan ilk taşıma
    }
    const idbx=await idbGet('dropbox');
    if(idbx && idbx.refreshToken && !dbx.refreshToken){ dbx=idbx; dbxSave(); }
  }catch(e){}
  const connected=await dbxHandleCallback();
  if(!connected && dbxConnected()) queueDbxSync();
  try{
    const rp=new URLSearchParams(location.search).get('report');
    if(rp){ history.replaceState(null,'',location.pathname); const t=getTree(rp); if(t){ view={name:'tree',id:t.id,tab:'plan'}; render(); openReport(t); } }
  }catch(e){}
})();

document.addEventListener('click', e=>{
  const el=e.target.closest('[data-dbxconnect],[data-dbxsync],[data-dbxrestore],[data-dbxdisconnect]');
  if(!el) return;
  if(el.hasAttribute('data-dbxconnect')) dbxStartAuth();
  else if(el.hasAttribute('data-dbxsync')){ toast(L('Eşitleniyor…','Syncing…')); dbxSyncAll(true).then(()=>{ const box=$('#dbxBox'); if(box) box.innerHTML=dbxSectionHTML(); }); }
  else if(el.hasAttribute('data-dbxrestore')) dbxRestore();
  else if(el.hasAttribute('data-dbxdisconnect')) dbxDisconnect();
});

/* ===================================================================
   CAPACITOR YEREL KÖPRÜ (iOS/Android uygulaması içinde çalışır;
   tarayıcıda etkisizdir). Kamera, yerel bildirim, kalıcı depolama.
   =================================================================== */
const __CAP = (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) ? window.Capacitor : null;
const __CP  = __CAP ? window.Capacitor.Plugins : null;

/* --- kalıcı depolama aynası (localStorage + Preferences) --- */
async function nativePersist(){
  if(__CP && __CP.Preferences){ try{ await __CP.Preferences.set({key:STORE_KEY, value:JSON.stringify(data)}); }catch(e){} }
}

/* --- yerel bildirim senkronu: görevler + sulama günü --- */
let __notifTimer=null;
function queueNotifSync(){ if(!__CP || !__CP.LocalNotifications) return; clearTimeout(__notifTimer); __notifTimer=setTimeout(syncNotifications,1500); }

async function syncNotifications(){
  if(!__CP || !__CP.LocalNotifications) return;
  try{
    let perm=await __CP.LocalNotifications.checkPermissions();
    if(perm.display!=='granted'){ perm=await __CP.LocalNotifications.requestPermissions(); if(perm.display!=='granted') return; }
    const pend=await __CP.LocalNotifications.getPending();
    if(pend && pend.notifications && pend.notifications.length){
      await __CP.LocalNotifications.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    }
    const today=todayISO(); const items=[];
    if(!feedPaused() && data.watering && data.watering.nextDate && data.watering.nextDate>=today){
      items.push({date:data.watering.nextDate, title:L('Gübreleme günü','Feeding day'),
        body:L('Sulama karışımı programı bugün.','Watering mix scheduled today.')});
    }
    getTasks().forEach(x=>{ if(x.date && x.date>=today) items.push({date:x.date, title:x.title, body:x.treeName||''}); });
    items.sort((a,b)=>a.date.localeCompare(b.date));
    const now=new Date(); const notifs=[];
    items.slice(0,60).forEach((it,i)=>{
      const at=new Date(it.date+'T09:00:00');
      if(at>now) notifs.push({id:i+1, title:it.title, body:it.body, schedule:{at:at}});
    });
    if(notifs.length) await __CP.LocalNotifications.schedule({notifications:notifs});
  }catch(e){}
}

/* --- save() sarmalayıcı: her kayıtta yerel depola + bildirimleri tazele --- */
const __webSave=save;
save=function(){ __webSave(); nativePersist(); queueNotifSync(); };

/* --- kamera: yerel uygulamada Capacitor Camera kullan --- */
if(__CP && __CP.Camera){
  pickImage=async function(cb,useCamera){
    try{
      const p=await __CP.Camera.getPhoto({resultType:'dataUrl', source:useCamera?'CAMERA':'PHOTOS',
        quality:72, width:1100, correctOrientation:true});
      if(p && p.dataUrl) cb(p.dataUrl);
    }catch(e){ /* kullanıcı iptal etti */ }
  };
}

/* --- yerel açılış: Preferences'taki veri daha güncelse onu yükle --- */
(async function nativeBoot(){
  if(!__CP) return;
  try{
    if(__CP.Preferences){
      const r=await __CP.Preferences.get({key:STORE_KEY});
      if(r && r.value){
        const cur=localStorage.getItem(STORE_KEY);
        if(r.value!==cur){ localStorage.setItem(STORE_KEY, r.value); data=migrate(load()); render(); }
      } else { nativePersist(); }
    }
    queueNotifSync();
  }catch(e){}
})();

render();
</script>
